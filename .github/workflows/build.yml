name: Build ESP32-S3 N16 Ultimate Master Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kdschlosser/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl make cmake python3 python3-pip ninja-build

      - name: Force Inject 2-Slot 16MB Partition Table (3.5MB + 3.5MB + 8.9MB)
        run: |
          python3 -c '
          import os, glob

          # ২-স্লট ৩.৫ MB + ৩.৫ MB ও ৮.৮৭ MB স্টোরেজ টেবিল
          table_lines = [
              "# ESP32-S3 16MB 2-Slot Multi-OS Partition Table",
              "# Name,   Type, SubType, Offset,   Size,     Flags",
              "nvs,      data, nvs,     0x9000,   0x6000,",
              "otadata,  data, ota,     0xf000,   0x2000,",
              "ota_0,    app,  ota_0,   0x20000,  0x380000,",
              "ota_1,    app,  ota_1,   0x3a0000, 0x380000,",
              "vfs,      data, fat,     0x720000, 0x8e0000,"
          ]
          new_table = "\n".join(table_lines) + "\n"

          # মাইক্রোপাইথনের সব সম্ভাব্য পার্টিশন ফাইলে সরাসরি ওভাররাইট করা
          target_patterns = [
              "**/partitions-16MiB.csv",
              "**/partitions*.csv",
              "**/boards/**/partitions*.csv"
          ]

          patched_count = 0
          for pattern in target_patterns:
              for f in glob.glob(pattern, recursive=True):
                  with open(f, "w") as pf:
                      pf.write(new_table)
                  print(">>> Force Patched Partition Table into:", f)
                  patched_count += 1

          print(f"Total {patched_count} partition files successfully updated!")
          '

      - name: Configure LVGL All-in-One Safe Features
        run: |
          python3 -c '
          import glob, re

          features_to_enable = [
              "LV_USE_KEYBOARD", "LV_USE_SPAN", "LV_USE_SPINBOX", "LV_USE_TEXTAREA",
              "LV_USE_FLEX", "LV_USE_GRID", "LV_USE_TABVIEW", "LV_USE_TILEVIEW", "LV_USE_WIN",
              "LV_USE_PERF_MONITOR", "LV_USE_MEM_MONITOR",
              "LV_USE_CHART", "LV_USE_SCALE", "LV_USE_COLORWHEEL", "LV_USE_CALENDAR",
              "LV_USE_LED", "LV_USE_MSGBOX", "LV_USE_SPINNER", "LV_USE_MENU",
              "LV_USE_PNG", "LV_USE_LODEPNG", "LV_USE_BMP", "LV_USE_TJPGD",
              "LV_USE_SJPG", "LV_USE_GIF", "LV_USE_QRCODE", "LV_USE_BARCODE", "LV_USE_SNAPSHOT",
              "LV_FONT_MONTSERRAT_12", "LV_FONT_MONTSERRAT_14", "LV_FONT_MONTSERRAT_16",
              "LV_FONT_MONTSERRAT_18", "LV_FONT_MONTSERRAT_20", "LV_FONT_MONTSERRAT_22",
              "LV_FONT_MONTSERRAT_24", "LV_FONT_MONTSERRAT_28",
              "LV_FONT_UNSCII_8", "LV_FONT_UNSCII_16"
          ]

          for path in glob.glob("**/lv_conf.h", recursive=True):
              with open(path, "r") as f:
                  code = f.read()

              for feat in features_to_enable:
                  pattern = rf"(#\s*define\s+{feat}\s+)0"
                  if re.search(pattern, code):
                      code = re.sub(pattern, r"\g<1>1", code)

              with open(path, "w") as f:
                  f.write(code)
              print("Patched LVGL Features in:", path)
          '

      - name: Compile N16 Firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            --flash-size=16 \
            DISPLAY=ili9341

      - name: Upload Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16-Octal-Ultimate-Master-Firmware
          path: build/*.bin
