name: Build ESP32-S3 N16 ILI9341 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kdschlosser/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl make cmake python3 python3-pip ninja-build

      - name: Configure LVGL (Enable Fonts 12-28px, UNSCII Mono, PNG, BMP)
        run: |
          python3 -c '
          import os, glob, re

          conf_files = glob.glob("**/lv_conf.h", recursive=True)
          print("Found config files to patch:", conf_files)

          features_to_enable = [
              "LV_FONT_MONTSERRAT_12",
              "LV_FONT_MONTSERRAT_14",
              "LV_FONT_MONTSERRAT_16",
              "LV_FONT_MONTSERRAT_18",
              "LV_FONT_MONTSERRAT_20",
              "LV_FONT_MONTSERRAT_22",
              "LV_FONT_MONTSERRAT_24",
              "LV_FONT_MONTSERRAT_28",
              "LV_FONT_UNSCII_8",
              "LV_FONT_UNSCII_16",
              "LV_USE_PNG",
              "LV_USE_BMP",
              "LV_USE_LODEPNG",
          ]

          for path in conf_files:
              with open(path, "r") as f:
                  content = f.read()

              for feat in features_to_enable:
                  pattern = rf"(#\s*define\s+{feat}\s+)0"
                  if re.search(pattern, content):
                      content = re.sub(pattern, r"\g<1>1", content)
                      print(f"  [ENABLED] {feat} in {path}")
                  else:
                      print(f"  [ALREADY_ON_OR_SET] {feat}")

              with open(path, "w") as f:
                  f.write(content)

          print("Configuration patching complete successfully!")
          '

      - name: Compile N16 Firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            --flash-size=16 \
            DISPLAY=ili9341

      - name: Upload Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16-Octal-ILI9341-Firmware
          path: build/*.bin
