name: Build ESP32-S3 N16 ILI9341 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout LVGL MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: kdschlosser/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Custom Fonts from User Repo
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl make cmake python3 python3-pip ninja-build

      - name: Inject and Fix Custom Fonts Headers
        run: |
          mkdir -p lib/lvgl/src/font
          echo "Copying 9 font files from user_repo/custom_fonts/ ..."
          cp -v user_repo/custom_fonts/*.c lib/lvgl/src/font/
          rm -rf user_repo

          echo "Fixing include headers inside custom font C files..."
          # কনভার্ট করা ফাইলের হেডার পাথ কম্পাইলারের সাথে ১০০% ম্যাচ করানো
          python3 -c '
          import glob

          for c_file in glob.glob("lib/lvgl/src/font/lv_font_*.c"):
              with open(c_file, "r") as f:
                  code = f.read()

              # LVGL v9 এর আসল ইন্টারনাল হেডার যুক্ত করা
              replacement = """#include "../../lvgl.h"\n#include "lv_font.h"\n#include "lv_font_fmt_txt.h" """
              if "#include \"lvgl.h\"" in code:
                  code = code.replace("#include \"lvgl.h\"", replacement)
              elif "#include \"lvgl/lvgl.h\"" in code:
                  code = code.replace("#include \"lvgl/lvgl.h\"", replacement)

              with open(c_file, "w") as f:
                  f.write(code)
              print("Fixed header in:", c_file)
          '

      - name: Configure LVGL (Declare Custom Fonts & Enable PNG/BMP)
        run: |
          python3 -c '
          import os, glob, re

          conf_files = glob.glob("**/lv_conf.h", recursive=True)
          print("Patching config files:", conf_files)

          decl_lines = "\n".join([
              "#define LV_FONT_CUSTOM_DECLARE \\",
              "    LV_FONT_DECLARE(lv_font_roboto_bold_20) \\",
              "    LV_FONT_DECLARE(lv_font_roboto_bold_22) \\",
              "    LV_FONT_DECLARE(lv_font_roboto_bold_24) \\",
              "    LV_FONT_DECLARE(lv_font_inter_12) \\",
              "    LV_FONT_DECLARE(lv_font_inter_16) \\",
              "    LV_FONT_DECLARE(lv_font_inter_18) \\",
              "    LV_FONT_DECLARE(lv_font_sharetech_12) \\",
              "    LV_FONT_DECLARE(lv_font_sharetech_16) \\",
              "    LV_FONT_DECLARE(lv_font_sharetech_18)"
          ])

          for path in conf_files:
              with open(path, "r") as f:
                  content = f.read()

              # Replace LV_FONT_CUSTOM_DECLARE safely
              content = re.sub(r"#\s*define\s+LV_FONT_CUSTOM_DECLARE.*", decl_lines, content)

              # PNG, BMP and fallback fonts
              features = [
                  "LV_FONT_MONTSERRAT_12", "LV_FONT_MONTSERRAT_16", "LV_FONT_MONTSERRAT_20",
                  "LV_USE_PNG", "LV_USE_BMP", "LV_USE_LODEPNG"
              ]
              for feat in features:
                  content = re.sub(rf"(#\s*define\s+{feat}\s+)0", r"\g<1>1", content)

              with open(path, "w") as f:
                  f.write(content)
              print("Successfully patched:", path)
          '

      - name: Compile N16 Firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            --flash-size=16 \
            DISPLAY=ili9341

          # ফাইল সত্যিই তৈরি হয়েছে কি না তা নিশ্চিত করা
          echo "=== Verifying generated binary ==="
          ls -lh build/*.bin

      - name: Upload Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16-Octal-ILI9341-CustomFonts
          path: build/*.bin
