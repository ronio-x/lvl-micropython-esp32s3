name: Build ESP32-S3 N16 ILI9341 Ultimate Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kdschlosser/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl make cmake python3 python3-pip ninja-build

      - name: Configure Partitions and LVGL Features
        run: |
          python3 -c "
          import os, glob, re
          csv_data = '# Name,Type,SubType,Offset,Size,Flags\nnvs,data,nvs,0x9000,0x6000,\notadata,data,ota,0xf000,0x2000,\nota_0,app,ota_0,0x20000,0x380000,\nota_1,app,ota_1,0x3a0000,0x380000,\nvfs,data,fat,0x720000,0x8e0000,\n'
          for f in glob.glob('**/partitions*.csv', recursive=True):
              open(f, 'w').write(csv_data)
              print('Patched Partition Table in:', f)

          feats = [
              'LV_USE_KEYBOARD', 'LV_USE_SPAN', 'LV_USE_SPINBOX', 'LV_USE_TEXTAREA',
              'LV_USE_FLEX', 'LV_USE_GRID', 'LV_USE_TABVIEW', 'LV_USE_TILEVIEW', 'LV_USE_WIN',
              'LV_USE_PERF_MONITOR', 'LV_USE_MEM_MONITOR',
              'LV_USE_CHART', 'LV_USE_SCALE', 'LV_USE_COLORWHEEL', 'LV_USE_CALENDAR',
              'LV_USE_LED', 'LV_USE_MSGBOX', 'LV_USE_SPINNER', 'LV_USE_MENU',
              'LV_USE_PNG', 'LV_USE_LODEPNG', 'LV_USE_BMP', 'LV_USE_TJPGD',
              'LV_USE_SJPG', 'LV_USE_GIF', 'LV_USE_QRCODE', 'LV_USE_BARCODE', 'LV_USE_SNAPSHOT',
              'LV_FONT_MONTSERRAT_12', 'LV_FONT_MONTSERRAT_14', 'LV_FONT_MONTSERRAT_16',
              'LV_FONT_MONTSERRAT_18', 'LV_FONT_MONTSERRAT_20', 'LV_FONT_MONTSERRAT_22',
              'LV_FONT_MONTSERRAT_24', 'LV_FONT_MONTSERRAT_28',
              'LV_FONT_UNSCII_8', 'LV_FONT_UNSCII_16'
          ]
          for conf in glob.glob('**/lv_conf.h', recursive=True):
              code = open(conf).read()
              for x in feats:
                  code = re.sub(rf'(#\s*define\s+{x}\s+)0', r'\g<1>1', code)
              open(conf, 'w').write(code)
              print('Patched LVGL Features in:', conf)
          "

      - name: Compile N16 Firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            --flash-size=16 \
            DISPLAY=ili9341

      - name: Upload Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16-Octal-Ultimate-Firmware
          path: build/*.bin
