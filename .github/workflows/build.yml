name: Build ESP32-S3 N16 ILI9341 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: kdschlosser/lvgl_micropython
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl make cmake python3 python3-pip ninja-build nodejs npm
          sudo npm install -g lv_font_conv

      - name: Download and Generate Custom Fonts
        run: |
          mkdir -p fonts_ttf
          mkdir -p lib/lvgl/src/font

          echo "Downloading TTF Fonts from Google..."
          curl -sSfL "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Bold.ttf" -o fonts_ttf/Roboto-Bold.ttf
          curl -sSfL "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf" -o fonts_ttf/Roboto-Regular.ttf
          curl -sSfL "https://github.com/google/fonts/raw/main/ofl/sharetechmono/ShareTechMono-Regular.ttf" -o fonts_ttf/ShareTechMono-Regular.ttf

          echo "Converting 9 Custom Fonts using lv_font_conv..."
          # Roboto Bold (20, 22, 24)
          lv_font_conv --font fonts_ttf/Roboto-Bold.ttf -r 0x20-0x7F --size 20 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_bold_20 -o lib/lvgl/src/font/lv_font_roboto_bold_20.c --no-kerning
          lv_font_conv --font fonts_ttf/Roboto-Bold.ttf -r 0x20-0x7F --size 22 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_bold_22 -o lib/lvgl/src/font/lv_font_roboto_bold_22.c --no-kerning
          lv_font_conv --font fonts_ttf/Roboto-Bold.ttf -r 0x20-0x7F --size 24 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_bold_24 -o lib/lvgl/src/font/lv_font_roboto_bold_24.c --no-kerning

          # Roboto Regular (12, 16, 18)
          lv_font_conv --font fonts_ttf/Roboto-Regular.ttf -r 0x20-0x7F --size 12 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_12 -o lib/lvgl/src/font/lv_font_roboto_12.c --no-kerning
          lv_font_conv --font fonts_ttf/Roboto-Regular.ttf -r 0x20-0x7F --size 16 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_16 -o lib/lvgl/src/font/lv_font_roboto_16.c --no-kerning
          lv_font_conv --font fonts_ttf/Roboto-Regular.ttf -r 0x20-0x7F --size 18 --bpp 4 --format lvgl --lv-font-name lv_font_roboto_18 -o lib/lvgl/src/font/lv_font_roboto_18.c --no-kerning

          # Share Tech Mono (12, 16, 18)
          lv_font_conv --font fonts_ttf/ShareTechMono-Regular.ttf -r 0x20-0x7F --size 12 --bpp 4 --format lvgl --lv-font-name lv_font_sharetech_12 -o lib/lvgl/src/font/lv_font_sharetech_12.c --no-kerning
          lv_font_conv --font fonts_ttf/ShareTechMono-Regular.ttf -r 0x20-0x7F --size 16 --bpp 4 --format lvgl --lv-font-name lv_font_sharetech_16 -o lib/lvgl/src/font/lv_font_sharetech_16.c --no-kerning
          lv_font_conv --font fonts_ttf/ShareTechMono-Regular.ttf -r 0x20-0x7F --size 18 --bpp 4 --format lvgl --lv-font-name lv_font_sharetech_18 -o lib/lvgl/src/font/lv_font_sharetech_18.c --no-kerning

          echo "All 9 fonts generated successfully!"

      - name: Configure LVGL (Declare Custom Fonts & Options)
        run: |
          python3 -c '
          import os, glob, re

          conf_files = glob.glob("**/lv_conf.h", recursive=True)
          print("Found config files to patch:", conf_files)

          custom_font_decl = """
          #define LV_FONT_CUSTOM_DECLARE \\
              LV_FONT_DECLARE(lv_font_roboto_bold_20) \\
              LV_FONT_DECLARE(lv_font_roboto_bold_22) \\
              LV_FONT_DECLARE(lv_font_roboto_bold_24) \\
              LV_FONT_DECLARE(lv_font_roboto_12) \\
              LV_FONT_DECLARE(lv_font_roboto_16) \\
              LV_FONT_DECLARE(lv_font_roboto_18) \\
              LV_FONT_DECLARE(lv_font_sharetech_12) \\
              LV_FONT_DECLARE(lv_font_sharetech_16) \\
              LV_FONT_DECLARE(lv_font_sharetech_18)
          """

          for path in conf_files:
              with open(path, "r") as f:
                  content = f.read()

              # Custom font declaration
              content = re.sub(r"#\s*define\s+LV_FONT_CUSTOM_DECLARE.*", custom_font_decl.strip(), content)

              # PNG, BMP and Montserrat defaults
              features = [
                  "LV_FONT_MONTSERRAT_18", "LV_FONT_MONTSERRAT_20", "LV_FONT_MONTSERRAT_24",
                  "LV_USE_PNG", "LV_USE_BMP", "LV_USE_LODEPNG"
              ]
              for feat in features:
                  content = re.sub(rf"(#\s*define\s+{feat}\s+)0", r"\g<1>1", content)

              with open(path, "w") as f:
                  f.write(content)
              print("Patched:", path)
          '

      - name: Compile N16 Firmware
        run: |
          python3 make.py esp32 \
            BOARD=ESP32_GENERIC_S3 \
            BOARD_VARIANT=SPIRAM_OCT \
            --flash-size=16 \
            DISPLAY=ili9341

      - name: Upload Firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: S3-N16-Octal-CustomFonts-Firmware
          path: build/*.bin
